# .gitlab-ci.yml -- mirror of .github/workflows/ci.yml for GitLab CI.
# Source of truth: GitHub repo Vriiii1/mdrrmo-cctv-hub (mirrored to GitLab).

stages:
  - validate
  - test

# Reusable docker-in-docker setup for any job that needs `docker run`.
.docker:
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2

yamllint:
  extends: .docker
  stage: validate
  script:
    - docker run --rm -v "$CI_PROJECT_DIR:/data" cytopia/yamllint -d relaxed /data

hadolint-auth-shim:
  extends: .docker
  stage: validate
  script:
    - docker run --rm -i hadolint/hadolint < auth-shim/Dockerfile

hadolint-caddy-path-a:
  extends: .docker
  stage: validate
  script:
    - docker run --rm -i hadolint/hadolint < caddy/Dockerfile.path-a

hadolint-caddy-path-b:
  extends: .docker
  stage: validate
  script:
    - docker run --rm -i hadolint/hadolint < caddy/Dockerfile.path-b

compose-config:
  extends: .docker
  stage: validate
  script:
    - cp .env.example .env
    # Both profiles must validate -- stops drift when only one is exercised manually.
    - CADDY_PROFILE=path-a docker compose config --quiet
    - CADDY_PROFILE=path-b docker compose config --quiet

caddy-validate:
  extends: .docker
  stage: validate
  script:
    - >
      docker run --rm -v "$CI_PROJECT_DIR/Caddyfile:/etc/caddy/Caddyfile:ro"
      caddy:2.8.4-alpine caddy validate --config /etc/caddy/Caddyfile

mediamtx-config-validate:
  extends: .docker
  stage: validate
  script:
    - |
      # Generate a throwaway self-signed cert so mediamtx can open the RTSPS listener.
      mkdir -p mediamtx/certs
      docker run --rm -v "$CI_PROJECT_DIR/mediamtx/certs:/certs" alpine/openssl \
        req -x509 -newkey rsa:2048 -nodes -days 1 \
        -keyout /certs/server.key -out /certs/server.crt \
        -subj "/CN=ci-test"
    - |
      # Boot mediamtx with the config; if parse or listener-open fails, container exits non-zero.
      docker run --rm --name mediamtx-validate \
        -v "$CI_PROJECT_DIR/mediamtx/mediamtx.yml:/mediamtx.yml:ro" \
        -v "$CI_PROJECT_DIR/mediamtx/certs:/certs:ro" \
        bluenviron/mediamtx:1.6.0 &
      BGPID=$!
      sleep 5
      if ! kill -0 $BGPID 2>/dev/null; then
        wait $BGPID
      fi
      docker stop mediamtx-validate || true
      wait $BGPID 2>/dev/null || true

shellcheck:
  extends: .docker
  stage: validate
  script:
    - docker run --rm -v "$CI_PROJECT_DIR:/mnt" koalaman/shellcheck:stable --severity=warning /mnt/scripts/setup.sh

test-shim:
  stage: test
  image: golang:1.22
  variables:
    GOPATH: $CI_PROJECT_DIR/.go
  cache:
    key:
      files:
        - auth-shim/go.mod
    paths:
      - .go/pkg/mod
  script:
    - cd auth-shim
    # go.sum is intentionally empty in the repo; populate transitive deps before test.
    - go mod tidy
    - go test ./... -race -count=1

name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: yamllint
        run: docker run --rm -v "$PWD:/data" cytopia/yamllint -d relaxed /data
      - name: hadolint auth-shim
        run: docker run --rm -i hadolint/hadolint < auth-shim/Dockerfile
      - name: hadolint caddy path-a
        run: docker run --rm -i hadolint/hadolint < caddy/Dockerfile.path-a
      - name: hadolint caddy path-b
        run: docker run --rm -i hadolint/hadolint < caddy/Dockerfile.path-b
      - name: compose-config (both profiles)
        run: |
          set -e
          cp .env.example .env
          # Both profiles must validate -- stops drift when only one is exercised manually.
          CADDY_PROFILE=path-a docker compose config --quiet
          CADDY_PROFILE=path-b docker compose config --quiet
      - name: caddy validate
        run: docker run --rm -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.8.4-alpine caddy validate --config /etc/caddy/Caddyfile
      - name: mediamtx config validate
        run: |
          set -e
          # Throwaway self-signed cert so mediamtx can open the RTSPS listener.
          mkdir -p mediamtx/certs
          docker run --rm -v "$PWD/mediamtx/certs:/certs" alpine/openssl \
            req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout /certs/server.key -out /certs/server.crt \
            -subj "/CN=ci-test"
          # Boot mediamtx with the config; give it 5 seconds to parse and bind.
          # If config or listener-open fails, mediamtx exits non-zero before the
          # timeout and we propagate that exit code below.
          docker run --rm --name mediamtx-validate \
            -v "$PWD/mediamtx/mediamtx.yml:/mediamtx.yml:ro" \
            -v "$PWD/mediamtx/certs:/certs:ro" \
            bluenviron/mediamtx:1.6.0 &
          BGPID=$!
          sleep 5
          if ! kill -0 $BGPID 2>/dev/null; then
            wait $BGPID
          fi
          docker stop mediamtx-validate || true
          wait $BGPID 2>/dev/null || true
      - name: shellcheck
        run: docker run --rm -v "$PWD:/mnt" koalaman/shellcheck:stable --severity=warning /mnt/scripts/setup.sh

  test-shim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: go mod tidy (populate go.sum)
        working-directory: auth-shim
        # go.sum is intentionally empty in the repo; tidy resolves and writes hashes.
        run: go mod tidy
      - name: go test
        working-directory: auth-shim
        run: go test ./... -race -count=1
